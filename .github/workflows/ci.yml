name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Dorado.Cli.Ipc references the sibling-repo project
      # project-dorado/dorado/src/Dorado.Plugins.Protocol (pure POCO JSON-RPC
      # types). Check it out and expose it at the sibling path the project
      # reference expects. The repo is public, so the default token works.
      - uses: actions/checkout@v4
        with:
          repository: project-dorado/dorado
          path: _deps/dorado
          fetch-depth: 1
      - name: Expose sibling dependency
        run: ln -s "$GITHUB_WORKSPACE/_deps/dorado" "$GITHUB_WORKSPACE/../dorado"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Dorado.sln

      - name: Build (Release, zero-warning policy)
        run: dotnet build Dorado.sln -c Release --no-restore /warnaserror

      # The suite includes the `EmulatorRpcServerTests` headless-validation
      # fixtures, which drive the `--ipc` JSON-RPC bridge over paired in-memory
      # transports against self-authored synthetic .ccgame/.zcp images. No
      # corpus is fetched, so this runs on every push without licensing risk.
      - name: Test (unit + container + IPC headless validation)
        run: dotnet test Dorado.sln -c Release --no-build --nologo

      # Golden-frame renderer regressions are part of M1RuntimeTests; they
      # no-op when the local corpus is absent, so this stays green.
      - name: Corpus-backed golden frames (when present)
        run: dotnet test Dorado.sln -c Release --no-build --nologo --filter "FullyQualifiedName~M1RuntimeTests"
