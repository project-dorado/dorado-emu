name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Dorado.sln

      - name: Build (Release, zero-warning policy)
        run: dotnet build Dorado.sln -c Release --no-restore /warnaserror

      # The suite includes the `EmulatorRpcServerTests` headless-validation
      # fixtures, which drive the `--ipc` JSON-RPC bridge over paired in-memory
      # transports against self-authored synthetic .ccgame/.zcp images. No
      # corpus is fetched, so this runs on every push without licensing risk.
      - name: Test (unit + container + IPC headless validation)
        run: dotnet test Dorado.sln -c Release --no-build --nologo

      # Golden-frame renderer regressions are part of M1RuntimeTests; they
      # no-op when the local corpus is absent, so this stays green.
      - name: Corpus-backed golden frames (when present)
        run: dotnet test Dorado.sln -c Release --no-build --nologo \
          --filter "FullyQualifiedName~M1RuntimeTests"
