name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Dorado.sln

      - name: Build
        run: dotnet build Dorado.sln -c Release --no-restore

      - name: Test
        run: dotnet test Dorado.sln -c Release --no-build
